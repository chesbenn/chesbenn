<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><script src="parts.js"></script></head><body>
<div class="app" style="grid-template-columns:250px 1fr 470px" id="app"></div>
<div class="badge">Роутер MikroTik — свой экран (макет)</div>
<script>
const ifs=[["ether1-uplink","412 Mbps","96 Mbps","up"],["sfp-sfpplus1 (OLT)","388 Mbps","402 Mbps","up"],["bridge-clients","301 Mbps","277 Mbps","up"],["ether5-office","12 Mbps","3 Mbps","up"],["ether7","—","—","down"]];
const q=[["Abonent_B","94 Mbps","100M","94%"],["Abonent_D","61 Mbps","100M","61%"],["Abonent_K","48 Mbps","50M","96%"],["Abonent_F","22 Mbps","100M","22%"]];
function spark(seed){let p="";for(let i=0;i<=40;i++){const y=14-Math.abs(Math.sin(i/4+seed))*10-Math.random()*2;p+=(i?"L":"M")+(i*3)+","+y.toFixed(1)}return `<svg width="120" height="18"><path d="${p}" fill="none" stroke="#38bdf8" stroke-width="1.3"/></svg>`}
document.getElementById("app").innerHTML = sidebar().replace('<div class="row ind sel"','<div class="row ind"').replace('<div class="row"><i class="dot" style="background:#22c55e"></i>MikroTik','<div class="row sel"><i class="dot" style="background:#22c55e"></i>MikroTik') + `
<div style="display:flex;flex-direction:column;min-width:0">
 <div class="top"><b style="font-size:14px">MikroTik</b><span class="mut">RB4011 · RouterOS 7.14 · 10.5.5.1</span><span style="margin-left:auto" class="mut">обновлено 8 с назад</span><span class="btn">⟳ Обновить</span></div>
 ${statusbar()}
 <div class="tabs"><span class="on">Интерфейсы</span><span>Очереди абонентов</span><span>Ресурсы</span><span>События и логи</span></div>
 <table style="margin-top:4px"><tr><th></th><th>Интерфейс</th><th style="text-align:right">Приём</th><th style="text-align:right">Передача</th><th>24 ч</th></tr>
 ${ifs.map((r,i)=>`<tr class="${i==0?'sel':''}"><td><i class="dot" style="display:inline-block;background:${r[3]=='up'?'#22c55e':'#6b7280'}"></i></td><td>${r[0]}</td><td class="mono" style="text-align:right">${r[1]}</td><td class="mono" style="text-align:right">${r[2]}</td><td>${r[3]=='up'?spark(i):'<span class="mut">выключен</span>'}</td></tr>`).join("")}</table>
 <div style="padding:14px 10px 4px" class="k">Самые загруженные очереди абонентов сейчас</div>
 <table><tr><th>Абонент</th><th style="text-align:right">Сейчас</th><th style="text-align:right">Тариф</th><th style="text-align:right">Загрузка</th></tr>
 ${q.map(r=>`<tr><td>${r[0]}</td><td class="mono" style="text-align:right">${r[1]}</td><td class="mono" style="text-align:right">${r[2]}</td><td class="mono ${parseInt(r[3])>90?'warn':''}" style="text-align:right">${r[3]}</td></tr>`).join("")}</table>
</div>
<div style="border-left:1px solid #222c35;background:#0f151b;padding:14px;display:flex;flex-direction:column;gap:12px">
 <div><div class="k">Роутер</div><div style="font-size:18px;font-weight:700">MikroTik</div><div class="mut mono">RB4011 · 10.5.5.1 · аптайм 41 д</div>
  <div style="margin-top:8px"><span class="pill" style="background:#14532d55;color:#22c55e">● Отвечает · опрос 8 с назад</span></div></div>
 <div class="card" style="border-color:#22c55e66;background:#22c55e0d"><b class="good">Всё в порядке</b><div class="mut" style="margin-top:4px">CPU и температура в норме, аплинк загружен на 41 %. 2 абонента упираются в свой тариф — это не авария.</div></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="kpi"><div class="k">CPU</div><div class="v mono">23%</div></div><div class="kpi"><div class="k">Температура</div><div class="v mono">47°</div></div><div class="kpi"><div class="k">Аплинк</div><div class="v mono">412M</div></div></div>
 <div class="card"><b>ether1-uplink · трафик 24 ч</b><div style="margin-top:8px">${chart(410,130,-30)}</div></div>
 <div style="display:flex;gap:8px"><span class="btn p">Страница роутера</span><span class="btn">Все метрики</span></div>
</div>`;
</script></body></html>
